  auto_bound:
    enabled: true
    auto_shrink: false
    integer_boundary_zone_steps: 1
    elite_probe_enabled: true
    require_probe_evidence_before_expansion: true
    reset_convergence_on_design_space_change: true
  preprod_gate:
    mandatory_for_this_stage: true
    stop_after_bundle: true
