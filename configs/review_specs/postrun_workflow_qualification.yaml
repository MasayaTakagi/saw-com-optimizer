spec_id: postrun_workflow_qualification_v1
stage: qualification
study_types:
  - postrun_workflow_qualification
target_size_bytes: 2097152
hard_size_bytes: 10485760
required_artifacts:
  - source: run_manifest.json
    destination: run_manifest.json
    category: orchestration
  - source: status.json
    destination: status.json
    category: orchestration
  - source: optimizer/metadata/run_completion.json
    destination: metadata/run_completion.json
    category: completion
  - source: optimizer/metadata/config_snapshot.yaml
    destination: metadata/config_snapshot.yaml
    category: configuration
  - source: optimizer/metadata/protocol_snapshot.json
    destination: metadata/protocol_snapshot.json
    category: protocol
  - source: optimizer/metadata/integrity_check.json
    destination: metadata/integrity_check.json
    category: integrity
  - source: optimizer/summary/primary_summary.csv
    destination: summary/primary_summary.csv
    category: primary_summary
  - source: optimizer/summary/scientific_limitations.md
    destination: summary/scientific_limitations.md
    category: scientific_limitations
required_globs:
  - source_pattern: optimizer/cells/*/*_result.json
    capture_regex: '^optimizer/cells/(?P<arm>[^/]+)/(?P<seed>[^/]+)_result\.json$'
    destination: cells/{arm}/{seed}_result.json
    category: terminal_result
  - source_pattern: optimizer/cells/*/*_status.json
    capture_regex: '^optimizer/cells/(?P<arm>[^/]+)/(?P<seed>[^/]+)_status\.json$'
    destination: cells/{arm}/{seed}_status.json
    category: terminal_status
optional_artifacts: []
optional_globs: []
