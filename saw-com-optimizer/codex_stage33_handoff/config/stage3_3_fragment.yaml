stage3_3:
  optimizer_backends:
    baseline: scipy_de_legacy
    candidate: lshade

  lshade:
    initial_population_per_dimension: 18
    min_population: 4
    history_size: 6
    pbest_max_fraction: 0.20
    archive_rate: 1.0
    normalized_coordinates: true
    max_duplicate_retries: 5

  unique_budget_checkpoints: [500, 1000, 2000, 4000, 8000]
  optional_max_budget: 16000
  auto_escalate: true

  feasibility_first:
    infeasible_order: [max_violation, sum_violation, worst_il_db]
    feasible_order: [worst_il_db, ripple_db]

  bounds:
    auto_expand: true
    auto_shrink: false
    integer_boundary_zone_steps: 1
    multi_seed_pressure_fraction: 0.80
    elite_probe_enabled: true
    elite_material_advantage_fraction: 0.05
    new_region_injection_fraction: 0.20
    on_expand_archive_policy: clear
    on_expand_parameter_memory_policy: preserve

  polish:
    integer_neighborhood_steps: [1, 2]
    powell_enabled_for_experiment: true
    powell_production_default: false
    powell_maxfev: 250

  ab_pilot:
    wiring: center_outer_same
    seeds: [20260909, 20260910, 20260911, 20260912, 20260913]
    budgets: [1000, 2000, 4000]
    auto_bound_for_optimizer_isolation: false
    basin_thresholds: [1.8, 1.6, 1.5]

  production_parallel:
    backend: process
    multiprocessing_start_method: spawn
    candidate_worker_counts: [1, 2, 4, 5]
    production_workers: auto_from_benchmark
    blas_threads_per_worker: 1

  review_bundle:
    self_contained: true
    include_source: true
    include_tests: true
    include_configs_at_runtime_paths: true
    include_trial_json: true
    include_raw_checkpoints: false
    include_npz: false
    verify_sha256: true
    run_empty_directory_self_test: true
