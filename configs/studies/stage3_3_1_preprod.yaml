  - ../stage3_3_fragment.yaml
impedance_grid_ohm: [50]
wirings: [center_outer_same, outer_ports]
seeds: [20260909, 20260910, 20260911, 20260912, 20260913]

convergence:
  impedance_ohm: 50.0
  min_cold_seeds: 5

stage3_3_1:
  tiny_smoke_seeds: [20260909, 20260910]
  tiny_smoke_unique_budget: 200
  tiny_smoke_wiring: center_outer_same
  optimizer_ab:
    checkpoint_budgets: [1000, 2000, 4000]
    population_schedule_terminal_budget: 4000
    hard_max_budget: 4000
    auto_bound: false
  production:
    hard_max_budget: 16000
    population_schedule_terminal_budget: 16000
    checkpoint_budgets: [500, 1000, 2000, 4000, 8000]
    process_workers_candidates: [1, 2, 4, 5]
