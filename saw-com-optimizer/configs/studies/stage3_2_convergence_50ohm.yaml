base_config: ../base/b28_dms_baseline.yaml
config_fragments: [../stage3_2_convergence_fragment.yaml]
impedance_grid_ohm: [50]
wirings: [outer_ports, center_outer_same]
seeds: [20260908, 20260909, 20260910, 20260911, 20260912]

convergence:
  impedance_ohm: 50.0
  min_cold_seeds: 5

optimizer:
  maxiter: 20
  maxiter_ceiling: 1000
  population: 14
  workers: 1

validation:
  dense_refinement_passes: 2
  adaptive_frequency_tolerance_hz: 1000
  adaptive_max_points_per_round: 64
  search_passband_max_step_mhz: 0.25
  search_stopband_max_step_mhz: 1.0
  max_step_mhz: 0.25

micro_polish:
  enabled: true
  integer_steps: [-1, 1]
  optional_second_integer_steps: [-2, 2]
  continuous_steps_fraction_of_bound_span: [0.01, 0.005]
  shrink_factor: 0.5
  max_passes: 4
  promote_in_production: true

layout:
  die_um: [900, 700]
  length_margin_um: 60
  width_margin_um: 60
  max_total_electrodes: 500
