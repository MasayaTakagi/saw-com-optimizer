base_config: ../base/b28_dms_baseline.yaml
config_fragments:
  - ../stage3_2_convergence_fragment.yaml
  - ../stage3_2_production_process5_fragment.yaml

# 50 ohm DMS production convergence from the handoff plan.
impedance_grid_ohm: [50]
wirings: [center_outer_same, outer_ports]
seeds: [20260909, 20260910, 20260911, 20260912, 20260913]

convergence:
  impedance_ohm: 50.0
  min_cold_seeds: 5

optimizer:
  maxiter: 20
  maxiter_ceiling: 1000
  population: 14
  workers: 1

optimizer_validation:
  budgets: [500, 1000, 2000, 4000]
  optional_max_budget: 8000
  auto_escalate: true
  min_cold_seeds: 5
  parallel:
    seed_level: true
    production_workers: 5
    benchmark_workers: [1, 2, 4, 5]
    benchmark_budget: 100
    blas_threads_per_worker: 1

benchmark_command: >-
  python -m sawopt.optimization.stage32_study
  --config configs/studies/next_50ohm_dms_production.yaml
  --run runs/next_50ohm_dms_production
