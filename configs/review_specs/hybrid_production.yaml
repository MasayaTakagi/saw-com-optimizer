spec_id: hybrid_production_v1
stage: stage4b
study_types:
  - hybrid_stage4b_topology_comparison
target_size_bytes: 2097152
hard_size_bytes: 10485760
required_artifacts:
  - source: run_manifest.json
    destination: run_manifest.json
    category: orchestration
  - source: status.json
    destination: status.json
    category: orchestration
  - source: optimizer/metadata/run_completion.json
    destination: metadata/run_completion.json
    category: completion
  - source: optimizer/metadata/config_snapshot.yaml
    destination: metadata/config_snapshot.yaml
    category: configuration
  - source: optimizer/metadata/protocol_snapshot.json
    destination: metadata/protocol_snapshot.json
    category: protocol
  - source: optimizer/metadata/integrity_check.json
    destination: metadata/integrity_check.json
    category: integrity
  - source: optimizer/metadata/stage4b_run_manifest.json
    destination: metadata/stage4b_run_manifest.json
    category: protocol_provenance
  - source: optimizer/topology_summary.csv
    destination: summary/primary_summary.csv
    category: primary_summary
  - source: optimizer/paired_comparisons.csv
    destination: summary/paired_comparisons.csv
    category: paired_comparisons
  - source: optimizer/convergence.csv
    destination: summary/convergence.csv
    category: convergence
  - source: optimizer/bound_pressure_summary.csv
    destination: summary/bound_pressure_summary.csv
    category: bound_pressure
  - source: optimizer/runtime_accounting_summary.csv
    destination: summary/runtime_accounting_summary.csv
    category: runtime_accounting
  - source: optimizer/scientific_limitations.md
    destination: summary/scientific_limitations.md
    category: scientific_limitations
  - source: optimizer/final_execution_report.md
    destination: summary/final_execution_report.md
    category: execution_report
optional_artifacts:
  - source: optimizer/REVIEW_ME.md
    destination: summary/review_notes.md
    category: review_notes
  - source: optimizer/symmetry_sanity_report.json
    destination: summary/symmetry_sanity_report.json
    category: symmetry
required_globs:
  - source_pattern: optimizer/optimization/*/seed*/cell_result.json
    capture_regex: '^optimizer/optimization/(?P<arm>[^/]+)/seed(?P<seed>[^/]+)/cell_result\.json$'
    destination: cells/{arm}/{seed}_result.json
    category: terminal_result
  - source_pattern: optimizer/optimization/*/seed*/cell_status.json
    capture_regex: '^optimizer/optimization/(?P<arm>[^/]+)/seed(?P<seed>[^/]+)/cell_status\.json$'
    destination: cells/{arm}/{seed}_status.json
    category: terminal_status
optional_globs: []
