name: PR22 Round 2 one-shot authorization fix

on:
  push:
    branches:
      - codex/stage4c-confirmatory-protocol

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: "${{ github.event.head_commit.message == 'chore: rerun PR22 Round 2 fix runner' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/stage4c-confirmatory-protocol
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply narrow Round 2 fix
        run: python .github/pr22_round2_fix_runner.py

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focused Stage 4C and orchestration regressions
        run: python -m pytest -q tests/unit/studies/test_hybrid_stage4c.py tests/unit/studies/test_hybrid_stage4b.py tests/unit/orchestration/test_cli.py tests/unit/orchestration/test_persistent_storage.py

      - name: Run full suite
        run: python -m pytest -q

      - name: Diff check
        run: git diff --check

      - name: Commit verified fix and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/pr22-round2-one-shot-fix.yml
          rm .github/pr22_round2_fix.py
          rm .github/pr22_round2_fix_runner.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden Stage 4C one-shot authorization'
          git push origin HEAD:codex/stage4c-confirmatory-protocol
