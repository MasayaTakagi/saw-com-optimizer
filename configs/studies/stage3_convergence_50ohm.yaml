base_config: ../base/b28_dms_baseline.yaml
config_fragments: [../../stage3_1_convergence_fragment.yaml]
impedance_grid_ohm: [50]
wirings: [outer_ports, center_outer_same]
seeds: [20260908, 20260909, 20260910, 20260911, 20260912]

convergence:
  impedance_ohm: 50.0
  unique_design_budgets: [500, 1000, 2000, 4000]
  optional_max_budget: 8000
  auto_escalate: true
  require_two_consecutive_plateaus: true
  min_cold_seeds: 5
  benchmark_early_stop: false
  warm_starts: false
  infeasible:
    paired_median_primary_relative_improvement: 0.02
    paired_median_primary_absolute_improvement: 0.02
    final_seed_primary_iqr: 0.10
    validation_primary_gap: 0.02
    best_polish_primary_improvement: 0.02
    late_improvement_final_budget_fraction: 0.25
  feasible:
    paired_median_il_improvement_db: 0.10
    final_seed_il_iqr_db: 0.20
    validation_il_gap_db: 0.10
    best_polish_il_improvement_db: 0.10
    late_improvement_final_budget_fraction: 0.25

budget_allocation:
  adaptive_round_fractions: [0.70, 0.20, 0.10]

validation:
  dense_refinement_passes: 2
  adaptive_frequency_rounds: 2
  adaptive_frequency_tolerance_hz: 1000
  adaptive_max_points_per_round: 64
  search_passband_max_step_mhz: 0.25
  search_stopband_max_step_mhz: 1.0
  max_step_mhz: 0.25

optimizer_runtime:
  history_flush_every: 100
  benchmark_jobs: 1
  parallel_jobs: 1
  parallel_benchmark_jobs: [1, 2, 4]
  blas_threads_per_worker: 1
  run_parallelism_benchmark: false
  production_early_stop: false
  min_generations_before_stop: 20
  patience_generations: 20

micro_polish:
  enabled: true
  benchmark_best_candidate: true
  benchmark_median_candidate: true
  integer_steps: [-1, 1]
  optional_second_integer_steps: [-2, 2]
  continuous_steps_fraction_of_bound_span: [0.01, 0.005]
  shrink_factor: 0.5
  max_passes: 4
  promote_in_production: true

layout:
  die_um: [900, 700]
  length_margin_um: 60
  width_margin_um: 60
  max_total_electrodes: 500
